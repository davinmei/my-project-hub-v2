<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="記錄我的學習歷程、AI 應用與工程開發成果。">
  <title>My Project Hub 2.0｜個人專案作品展示平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-content">
      <a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">✦</span> My Project Hub 2.0</a>
      <button class="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="開啟或收合選單">☰</button>
      <nav id="main-nav" class="nav-links" aria-label="主要導覽">
        <a href="index.html" aria-current="page" class="active">首頁</a>
        <a href="projects.html">作品總覽</a>
        <a href="about.html">關於我</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero-content">
        <h1 id="hero-title">探索技術，<span>實踐想法。</span></h1>
        <p class="hero-subtitle">記錄我的學習歷程、AI 應用與工程開發成果。</p>
        <p class="hero-intro">這裡收錄我在生成式 AI、網頁開發及相關工程技術領域的實作成果，並持續記錄學習與專案開發的過程。</p>
        <div class="page-actions">
          <a class="btn btn-primary" href="projects.html">瀏覽所有作品 <span aria-hidden="true">→</span></a>
          <a class="btn btn-secondary" href="about.html">關於我</a>
        </div>
      </div>
    </section>

    <section class="overview container" aria-labelledby="overview-title">
      <h2 class="visually-hidden" id="overview-title">作品統計</h2>
      <div id="project-stats" aria-live="polite" aria-atomic="true">
        <dl class="stats-row">
          <div class="stat">
            <dt>專案作品</dt>
            <dd><strong id="project-count">—</strong></dd>
          </div>
          <div class="stat">
            <dt>技術分類</dt>
            <dd>
              <strong id="category-count">—</strong>
              <small id="category-list" class="category-list">正在載入分類…</small>
            </dd>
          </div>
          <div class="stat">
            <dt>專案類型</dt>
            <dd><strong id="type-count">—</strong></dd>
          </div>
        </dl>
      </div>
    </section>

    <section class="section home-section" aria-labelledby="latest-title">
      <div class="container">
        <div class="section-heading"><h2 id="latest-title">最新作品</h2></div>
        <div id="latest-project" aria-live="polite"><p class="loading">正在載入作品…</p></div>
      </div>
    </section>

    <section class="section home-section" id="featured" aria-labelledby="featured-title">
      <div class="container">
        <div class="section-heading"><h2 id="featured-title">精選作品</h2></div>
        <div class="cards-grid featured-grid" id="featured-projects" aria-live="polite">
          <p class="loading">正在載入作品…</p>
        </div>
        <div class="section-actions">
          <a class="btn btn-secondary" href="projects.html">查看所有作品 <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-layout">
      <div>
        <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span> My Project Hub 2.0</div>
        <p>收集每一次實作，記錄每一步成長。</p>
        <p>網站最後更新 <time id="last-updated">載入中…</time></p>
      </div>
      <nav class="footer-links" aria-label="頁尾導覽">
        <a href="index.html">首頁</a>
        <a href="projects.html">所有作品</a>
        <a href="about.html">關於我</a>
        <a href="AGENTS.md">開發規範</a>
        <a href="https://github.com/davinmei/my-project-hub-v2">V2 原始碼</a>
        <a href="https://github.com/davinmei/my-project-hub">V1 原版參考</a>
      </nav>
    </div>
  </footer>
  <script src="data/projects-data.js"></script>
  <script src="js/site-data.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
  <script src="js/site-update.js"></script>
</body>
</html>
