<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="了解我的學習背景、技術領域與發展方向。">
  <title>關於我｜My Project Hub 2.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-content">
      <a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">✦</span> My Project Hub 2.0</a>
      <button class="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="開啟或收合選單">☰</button>
      <nav id="main-nav" class="nav-links" aria-label="主要導覽">
        <a href="index.html">首頁</a>
        <a href="projects.html">作品總覽</a>
        <a href="about.html" aria-current="page" class="active">關於我</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-hero" aria-labelledby="about-title">
      <div class="container">
        <h1 class="page-title" id="about-title">關於我</h1>
        <p class="about-subtitle" lang="en">About Me</p>
        <div id="profile-intro" aria-live="polite">
          <p class="loading">正在載入個人資料…</p>
        </div>
        <div class="page-actions" id="profile-links">
          <a class="btn btn-primary" href="projects.html">瀏覽作品 <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>
    <div class="container section" id="profile-content" hidden>
      <section class="about-section" aria-labelledby="education-title">
        <div class="section-heading"><h2 id="education-title">學習背景</h2></div>
        <div class="about-grid" id="profile-education"></div>
      </section>
      <section class="about-section" aria-labelledby="skills-title">
        <div class="section-heading">
          <h2 id="skills-title">技術能力</h2>
          <p class="page-intro" id="profile-skills-note"></p>
        </div>
        <div class="about-grid about-grid--skills" id="profile-skills"></div>
      </section>
      <section class="about-section" aria-labelledby="interests-title">
        <div class="section-heading"><h2 id="interests-title">興趣與發展方向</h2></div>
        <div class="about-grid about-grid--interests" id="profile-interests"></div>
      </section>
      <section class="about-section" aria-labelledby="about-site-title">
        <div class="section-heading"><h2 id="about-site-title">關於這個網站</h2></div>
        <div class="about-card">
          <div id="profile-site"></div>
          <div class="page-actions">
            <a class="btn btn-secondary" href="projects.html">返回作品總覽</a>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-layout">
      <div>
        <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span> My Project Hub 2.0</div>
        <p>收集每一次實作，記錄每一步成長。</p>
      </div>
      <nav class="footer-links" aria-label="頁尾導覽">
        <a href="index.html">首頁</a>
        <a href="projects.html">所有作品</a>
        <a href="about.html">關於我</a>
        <a href="AGENTS.md">開發規範</a>
        <a href="https://github.com/davinmei/my-project-hub-v2">V2 原始碼</a>
        <a href="https://github.com/davinmei/my-project-hub">V1 原版參考</a>
      </nav>
    </div>
  </footer>
  <script src="data/profile-data.js"></script>
  <script src="js/site-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/about.js"></script>

</html>
